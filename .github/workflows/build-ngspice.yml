name: build-ngspice-linux

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tool branch
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool bison flex libreadline-dev libncurses-dev libfftw3-dev git
      - name: Clone current ngspice mirror
        run: git clone --depth 1 https://github.com/imr/ngspice.git ngspice-src
      - name: Build ngspice
        run: |
          cd ngspice-src
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$GITHUB_WORKSPACE/ngspice-runtime" --with-readline=yes --disable-debug
          make -j2
          make install
          "$GITHUB_WORKSPACE/ngspice-runtime/bin/ngspice" --version || true
      - name: Package runtime
        run: tar -C "$GITHUB_WORKSPACE" -czf ngspice-linux-x86_64.tar.gz ngspice-runtime
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: ngspice-linux-x86_64
          path: ngspice-linux-x86_64.tar.gz
          retention-days: 1
